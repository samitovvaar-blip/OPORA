name: Send trial emails

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: opora-trial-email

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      OPORA_EMAIL_FROM: ${{ vars.OPORA_EMAIL_FROM }}
      OPORA_TELEGRAM_CHANNEL: ${{ vars.OPORA_TELEGRAM_CHANNEL }}
      OPORA_INSTAGRAM_URL: ${{ vars.OPORA_INSTAGRAM_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check sender configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" || -z "$RESEND_API_KEY" || -z "$OPORA_EMAIL_FROM" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.config.outputs.enabled == 'true'
        working-directory: scripts/trial-email
      - name: Send due emails
        if: steps.config.outputs.enabled == 'true'
        run: |
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key_file"
          GOOGLE_APPLICATION_CREDENTIALS="$key_file" node scripts/trial-email/send.mjs
